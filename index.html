<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LUXEN XIT - Master Control & Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #03060f;
    --card-bg: #080e1a;
    --card-border: rgba(0, 229, 255, 0.25);
    --accent-blue: #0088ff;
    --accent-glow: #00e5ff;
    --text-white: #ffffff;
    --text-muted: #8ab4f8;
    --danger-red: #ff1744;
    --success-green: #00e676;
    --warning-yellow: #ffd600;
  }

  * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: radial-gradient(ellipse at 50% -10%, #061c3d 0%, #03060f 38%, #010206 75%);
    color: var(--text-white);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card-container {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 229, 255, 0.15), inset 0 1px rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
  }

  .card-container::before {
    content: "";
    position: absolute;
    top: -80px; right: -80px;
    width: 180px; height: 180px;
    background: rgba(0, 229, 255, 0.08);
    border-radius: 50%;
    filter: blur(20px);
    pointer-events: none;
  }

  .brand-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--text-white);
    font-style: italic;
    margin-bottom: 2px;
    text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
  }
  .brand-title span { 
    color: var(--accent-glow); 
    font-style: normal; 
    display: block; 
    font-size: 0.7rem; 
    letter-spacing: 3px; 
    margin-top: 2px;
    font-weight: 800;
  }

  .sub-title {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 20px;
    font-weight: 700;
  }

  /* قسم الإحصائيات (كم موزع وإحصائيات عامة) */
  .stats-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: rgba(2, 5, 12, 0.8);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--accent-glow);
    text-shadow: 0 0 10px rgba(0,229,255,0.4);
  }
  .stat-lbl {
    font-size: 0.65rem;
    color: var(--text-muted);
    font-weight: 700;
    margin-top: 2px;
    text-transform: uppercase;
  }

  /* خانات وضع الصيانة المنفصلة */
  .maintenance-box {
    background: rgba(2, 5, 12, 0.8);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .maintenance-title {
    font-size: 0.8rem;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  /* سويتش الصيانة */
  .switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 24px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #222;
    transition: .4s;
    border-radius: 24px;
    border: 1px solid var(--card-border);
  }
  .slider:before {
    position: absolute; content: "";
    height: 18px; width: 18px;
    left: 3px; bottom: 2px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--danger-red); box-shadow: 0 0 10px var(--danger-red); }
  input:checked + .slider:before { transform: translateX(20px); }

  .divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    margin: 18px 0;
  }

  .section-heading {
    font-size: 0.78rem;
    color: var(--accent-glow);
    font-weight: 800;
    margin-bottom: 12px;
    text-align: right;
    letter-spacing: 0.5px;
  }

  .input-group {
    position: relative;
    margin-bottom: 14px;
  }

  .input-field {
    width: 100%;
    background: #02050c;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 44px 14px 16px;
    color: #fff;
    font-family: 'Cairo', 'Orbitron', sans-serif;
    font-size: 0.9rem;
    text-align: right;
    outline: none;
    transition: all 0.3s ease;
  }
  
  .input-field:focus { 
    border-color: var(--accent-glow); 
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); 
  }

  .eye-btn {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 4px;
    transition: color 0.2s;
  }
  .eye-btn:hover { color: var(--accent-glow); }

  /* شريط قوة كلمة السر */
  .strength-meter {
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    margin: -6px 0 14px 0;
    overflow: hidden;
    display: none;
  }
  .strength-fill {
    height: 100%;
    width: 0%;
    transition: width 0.3s ease, background-color 0.3s ease;
  }

  .btn-submit {
    width: 100%;
    background: linear-gradient(100deg, var(--accent-glow), var(--accent-blue));
    border: none;
    border-radius: 14px;
    color: #03060f;
    padding: 15px;
    font-weight: 900;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 229, 255, 0.3);
    margin-top: 6px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg-box {
    margin-top: 15px;
    font-size: 0.8rem;
    font-weight: 700;
    min-height: 22px;
    line-height: 1.4;
  }

  /* حركة الاهتزاز عند الخطأ */
  .shake { animation: shakeAnim 0.4s ease-in-out; }
  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .spinner {
    width: 18px; height: 18px;
    border: 3px solid rgba(3, 6, 15, 0.3);
    border-top-color: #03060f;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body onload="initMasterControl()">

<div class="card-container" id="mainCard">
  <div class="brand-title">
    LUXEN XIT
    <span>MASTER CONTROL 🟢</span>
  </div>
  <div class="sub-title">لوحة التحكم وإدارة النظام المركزية</div>

  <!-- قسم الإحصائيات (عدد الموزعين والمفاتيح) -->
  <div class="stats-box">
    <div class="stat-card">
      <div class="stat-num" id="totalResellersStat">0</div>
      <div class="stat-lbl">عدد الموزعين 👤</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="totalKeysStat">0</div>
      <div class="stat-lbl">إجمالي المفاتيح 🔑</div>
    </div>
  </div>

  <!-- أزرار تحكم وضع الصيانة المستقلة (مطابقة تماماً لمواقعك العادية ومواقع الموزعين) -->
  <div class="maintenance-box">
    <div class="maintenance-title">
      <span>🛠️ صيانة موقع العملاء (Client)</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="maintClientToggle" onchange="toggleMaintenanceState('client')">
      <span class="slider"></span>
    </label>
  </div>

  <div class="maintenance-box">
    <div class="maintenance-title">
      <span>🛡️ صيانة موقع الموزعين (Reseller)</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="maintResellerToggle" onchange="toggleMaintenanceState('reseller')">
      <span class="slider"></span>
    </label>
  </div>

  <div class="divider"></div>

  <div class="section-heading">🔐 تغيير كلمة سر الأدمن وطرد الجلسات</div>

  <!-- الخانة الأولى: كلمة السر الحالية -->
  <div class="input-group">
    <input type="password" id="oldPass" class="input-field" placeholder="🔑 كلمة السر الحالية" autocomplete="off">
    <button class="eye-btn" onclick="toggleVisibility('oldPass', this)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
    </button>
  </div>

  <!-- الخانة الثانية: كلمة السر الجديدة -->
  <div class="input-group">
    <input type="password" id="newPass" class="input-field" placeholder="✨ كلمة السر الجديدة" oninput="checkStrength(this.value)" autocomplete="off">
    <button class="eye-btn" onclick="toggleVisibility('newPass', this)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
    </button>
  </div>

  <!-- مؤشر قوة كلمة السر -->
  <div id="strengthMeter" class="strength-meter">
    <div id="strengthFill" class="strength-fill"></div>
  </div>
  
  <button id="submitBtn" class="btn-submit" onclick="changeAdminPassword()">
    <span id="spin" class="spinner"></span>
    <span id="btnText">تحديث كلمة السر وطرد الجلسات ➔</span>
  </button>

  <div id="msg" class="msg-box"></div>
</div>

<script>
  const WEB_API_KEY = 'AIzaSyAzQJuIPLwJsTJ1veR3f4trvfZoGhprduA';
  const FIREBASE_URL = 'https://luxen-pro-default-rtdb.firebaseio.com/';

  function showMsg(txt, color, shake = false) {
    const msg = document.getElementById('msg');
    const card = document.getElementById('mainCard');
    msg.style.color = color;
    msg.innerHTML = txt;

    if (shake) {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  }

  function toggleVisibility(id, btn) {
    const input = document.getElementById(id);
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.innerHTML = isPass 
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
  }

  function checkStrength(val) {
    const meter = document.getElementById('strengthMeter');
    const fill = document.getElementById('strengthFill');
    if (!val) { meter.style.display = 'none'; return; }
    meter.style.display = 'block';

    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val) || /[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    if (score <= 1) {
      fill.style.width = '30%';
      fill.style.backgroundColor = 'var(--danger-red)';
    } else if (score === 2 || score === 3) {
      fill.style.width = '65%';
      fill.style.backgroundColor = 'var(--warning-yellow)';
    } else {
      fill.style.width = '100%';
      fill.style.backgroundColor = 'var(--success-green)';
    }
  }

  function setLoading(loading) {
    const btn = document.getElementById('submitBtn');
    const spin = document.getElementById('spin');
    const btnText = document.getElementById('btnText');
    btn.disabled = loading;
    spin.style.display = loading ? 'inline-block' : 'none';
    btnText.textContent = loading ? 'جاري التنفيذ...' : 'تحديث كلمة السر وطرد الجلسات ➔';
  }

  async function getAuthToken() {
    try {
      const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${WEB_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ returnSecureToken: true })
      });
      const data = await res.json();
      return data.idToken;
    } catch (e) { return null; }
  }

  // جلب الإحصائيات وحالة الصيانة المنفصلة عند فتح الصفحة
  async function initMasterControl() {
    try {
      const token = await getAuthToken();
      if (!token) return;

      // 1. جلب عدد الموزعين وإجمالي المفاتيح للإحصائيات
      const resData = await fetch(`${FIREBASE_URL}.json?auth=${token}`);
      const db = await resData.json();
      if (db) {
        const resellersCount = db.resellers ? Object.keys(db.resellers).length : 0;
        const keysCount = db.keys ? Object.keys(db.keys).length : 0;

        document.getElementById('totalResellersStat').textContent = resellersCount;
        document.getElementById('totalKeysStat').textContent = keysCount;

        // قراءة حالة الصيانة المنفصلة (client و reseller) المطابقة لقواعدك
        if (db.settings && db.settings.maintenance) {
          if (db.settings.maintenance.client === true) {
            document.getElementById('maintClientToggle').checked = true;
          }
          if (db.settings.maintenance.reseller === true) {
            document.getElementById('maintResellerToggle').checked = true;
          }
        }
      }
    } catch (e) {
      console.error("Error loading analytics");
    }
  }

  // تفعيل أو إيقاف وضع الصيانة المنفصل (client أو reseller)
  async function toggleMaintenanceState(type) {
    const isChecked = document.getElementById(type === 'client' ? 'maintClientToggle' : 'maintResellerToggle').checked;
    try {
      const token = await getAuthToken();
      
      // جلب الكائن الحالي للصيانة أولاً لكي لا نحذف أحدهما عند تعديل الآخر
      const getRes = await fetch(`${FIREBASE_URL}settings/maintenance.json?auth=${token}`);
      let currentMaint = await getRes.json() || { client: false, reseller: false };
      
      currentMaint[type] = isChecked;

      // تحديث مسار الصيانة في Firebase بالشكل المتوافق مع مواقعك
      await fetch(`${FIREBASE_URL}settings/maintenance.json?auth=${token}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentMaint)
      });

      showMsg(isChecked ? `🚨 تم تفعيل صيانة (${type}) بنجاح!` : `✅ تم إيقاف صيانة (${type})!`, isChecked ? 'var(--danger-red)' : 'var(--success-green)');
    } catch (e) {
      showMsg('❌ خطأ في تغيير وضع الصيانة', 'var(--danger-red)', true);
    }
  }

  // تغيير كلمة المرور وطرد جميع الجلسات الأخرى النشطة
  async function changeAdminPassword() {
    let oldInput = document.getElementById('oldPass').value.trim();
    let newInput = document.getElementById('newPass').value.trim();

    if (!oldInput || !newInput) {
      showMsg('⚠ يرجى ملء جميع الخانات المطلوبة!', 'var(--danger-red)', true);
      return;
    }

    if (newInput.length < 4) {
      showMsg('⚠ كلمة السر الجديدة قصيرة جداً (أقل شيء 4 حروف)!', 'var(--warning-yellow)', true);
      return;
    }

    setLoading(true);
    showMsg('⏳ جاري التحقق وتحديث النظام...', 'var(--accent-glow)');

    try {
      const token = await getAuthToken();
      if (!token) {
        setLoading(false);
        showMsg('❌ فشل الاتصال بالخدمة!', 'var(--danger-red)', true);
        return;
      }

      const res = await fetch(`${FIREBASE_URL}settings/admin_pass.json?auth=${token}`);
      let currentPass = await res.json();
      if (!currentPass) currentPass = "21447348";

      if (oldInput !== currentPass) {
        setLoading(false);
        showMsg('❌ كلمة السر الحالية غير صحيحة!', 'var(--danger-red)', true);
        return;
      }

      // 1. تحديث كلمة المرور الجديدة في المسار المخصص
      await fetch(`${FIREBASE_URL}settings/admin_pass.json?auth=${token}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newInput)
      });

      // 2. إرسال أمر الطرد الفوري لجميع الجلسات المفتوحة للأدمن
      await fetch(`${FIREBASE_URL}settings/password_changed_at.json?auth=${token}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Date.now())
      });

      setLoading(false);
      showMsg('✅ تم تحديث كلمة السر بنجاح وطرد أي جلسة أدمن أخرى!', 'var(--success-green)');
      document.getElementById('oldPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('strengthMeter').style.display = 'none';
    } catch (e) {
      setLoading(false);
      showMsg('❌ حدث خطأ غير متوقع أثناء الاتصال!', 'var(--danger-red)', true);
    }
  }
</script>

</body>
</html>
